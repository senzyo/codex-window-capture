[package]
name = "window-capture"
version = "0.1.0"
edition = "2024"
publish = false
description = "Capture a single foreground Windows application window as a PNG"
license = "MIT"

[dependencies]
tempfile = "=3.27.0"
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
